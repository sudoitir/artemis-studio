# Spring keeps every distinct test context cached, each with its own pool, so a context keeps no idle
# connections and gives them back quickly; the shared test server would otherwise run out (ADR-0195).
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000

# A broker call inside a database transaction fails the test that makes it (BrokerCallGuard).
rahdar.broker.forbid-calls-in-transaction=true
