spring:
  application:
    name: artemis-studio

  datasource:
    url: ${ARTEMIS_STUDIO_DB_URL:jdbc:postgresql://localhost:5432/artemis_studio}
    username: ${ARTEMIS_STUDIO_DB_USER:artemis_studio}
    password: ${ARTEMIS_STUDIO_DB_PASSWORD:artemis_studio}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  session:
    store-type: jdbc
    jdbc:
      # Liquibase owns this schema (014-identity.sql), not the library's own
      # initializer (ADR-0011).
      initialize-schema: never
      table-name: spring_session

  # OIDC/SSO (ADR-0040) is opt-in: with no `spring.security.oauth2.client.registration.*`
  # entry configured, Spring Boot's OAuth2 client auto-configuration backs off
  # entirely and only local login is available. Uncomment and fill in to enable
  # it — never commit a real client-secret; source it from the environment.
  #
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         studio:
  #           client-id: ${ARTEMIS_STUDIO_OIDC_CLIENT_ID:}
  #           client-secret: ${ARTEMIS_STUDIO_OIDC_CLIENT_SECRET:}
  #           scope: openid,profile,email,groups
  #       provider:
  #         studio:
  #           issuer-uri: ${ARTEMIS_STUDIO_OIDC_ISSUER_URI:}

  jpa:
    # Liquibase owns the schema; Hibernate only maps to it and checks the mapping
    # on startup. Never let Hibernate touch DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        name: artemis-studio
        version: 1.0.0
        # SYNC is load-bearing, not a preference (ADR-0045). The tool body must stay
        # on the servlet thread: PermissionResolver reads SecurityContextHolder and
        # ActorResolver reads RequestContextHolder, both ThreadLocal. Under ASYNC the
        # work moves to a Reactor scheduler, the context is empty, and every tool
        # answers "no cluster visible" — a config mistake that presents as a
        # permissions bug. McpAuthorizationIntegrationTest is the regression guard.
        type: SYNC
        # No session map, no sticky routing, compatible with multi-instance HA. Also
        # sidesteps the unbounded-session class of problem behind CVE-2026-59279 in
        # 2.0.0's STREAMABLE transport, which is why the pom pins 2.0.1.
        protocol: STATELESS
        annotation-scanner:
          enabled: true
        capabilities:
          # Declaring a capability we do not implement is worse than not having it.
          # There is no @McpComplete anywhere in the surface.
          completion: false
        # Under a host that searches tools rather than dumping tools/list, this is
        # the discovery index — it is the only text guaranteed to be read.
        instructions: >
          Artemis Studio: cluster-wide management and observability for Apache
          ActiveMQ Artemis brokers. Read tools: cluster_health (HA state,
          split-brain, firing alerts), list_resources (queues, addresses,
          consumers, sessions, connections, producers), diagnose_queue (one queue,
          end to end), metric_series, config_diff, browse_messages,
          trace_request_reply, activity_log. Mutating tools: queue_action,
          send_message, alert_rule, studio_setting — all default to dryRun=true and
          a real destructive run needs `confirm` to equal the subject's name.
          Resources: studio://clusters, studio://permissions,
          cluster://{id}/topology, cluster://{id}/capabilities. Start from
          studio://clusters for the cluster ids this key can see, and
          studio://permissions for what it may do.

  task:
    scheduling:
      # The tiered scrape scheduler (ADR-0015) runs three overlapping tiers plus a
      # limiter refill and an SSE heartbeat. Give it its own small pool so a slow
      # tick never starves the others; per-node fan-out inside a tier is on
      # virtual threads.
      pool:
        size: 4
      thread-name-prefix: scrape-

server:
  port: ${ARTEMIS_STUDIO_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,refresh
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    build:
      enabled: true

# Application configuration, bound by ArtemisStudioProperties.
#
# These are DEFAULTS. Most of this tree is overridable at runtime from Settings
# (a studio_setting row wins over the value here, and deleting the row restores
# it) — SettingsService.REGISTRY is the list of exactly which keys, and is the
# one place to add another. Nothing here is seeded into the database on first
# start, on purpose: an absent row means "use the packaged default", so an
# upgrade ships a new default instead of being pinned by a row written once.
artemis-studio:
  # base64 of 32 bytes; encrypts stored broker credentials (ADR-0009).
  # The app fails to start if this is missing or the wrong length.
  secret-key: ${ARTEMIS_STUDIO_SECRET_KEY:}
  branding:
    # If the project is renamed, this string and Branding.java move together.
    product-name: "Artemis Studio"
  scrape:
    # Tiered polling cadence (ADR-0015).
    tier-a-interval: 5s      # HA state + topology + split-brain corroboration
    tier-b-interval: 15s     # re-read the queues that were busy last sweep
    tier-c-interval: 5m      # walk the whole queue set, one page per tick
  rate-limit:
    # Per broker node. Conservative default so Studio never becomes the load.
    # Enforced by NodeCallLimiter (a per-node permit bucket refilled each second).
    management-calls-per-second: 20
  broker:
    # RestClient timeouts for every Jolokia call (ADR-0010).
    connect-timeout: 3s
    read-timeout: 10s
  metric:
    # Raw metric_sample retention in days (ADR-0006). MetricSampleReaper trims
    # older rows nightly.
    retention-days: 7
    reaper-cron: "0 30 3 * * *"               # MetricSampleReaper
    partition-maintainer-cron: "0 0 3 * * *"  # MetricPartitionMaintainer, just before it
  mcp:
    # Result caps for the MCP surface (ADR-0045); tighter than REST's on purpose.
    # A mutation ceiling is NOT set here — that inherits safety.bulk-cap below.
    default-limit: 25
    max-limit: 100
  safety:
    # Server-enforced ceiling on one destructive message operation (ADR-0022).
    # A dry-run count above this is a 422 unless ?override=true (behind the UI's
    # typed confirmation).
    bulk-cap: 1000
  events:
    # Broker-event history (ADR-0028). coalesce-window-millis is the only
    # compile-time value here — TopicCoalescer reads it once at construction.
    retention: 72h            # BrokerEventReaper trims older rows hourly
    buffer-size: 10000        # bounded write buffer; overflow is dropped and counted
    flush: 1s                 # BrokerEventWriter batch-insert interval
    reaper-cron: "0 15 * * * *"   # BrokerEventReaper
    coalesce-window-millis: 1000  # derived resource-view SSE signal coalescing (slice 3)
  rr:
    # Request-reply tracing (Phase 5). percentile-window is the only compile-time
    # value here: it is a Micrometer distributionStatisticExpiry fixed when the
    # Timer is registered, so a later change would silently not apply.
    default-deadline-ms: 30000     # used only when neither the message nor its expectation carries a deadline
    sweep-interval: 5s             # RrDeadlineSweep cadence
    sample-interval: 5s            # RrSampler cadence
    percentile-window: 15m         # Micrometer Timer distributionStatisticExpiry
    payload-capture-bytes: 4096    # captured request/reply body cap when an expectation enables capture
    retention: 7d                  # RrFlowReaper trims older rr_flow/rr_event rows
    reaper-cron: "0 20 3 * * *"    # RrFlowReaper
  alerting:
    # Notification delivery (Phase 7, ADR-0036). A separate RestClient from the
    # broker one — never shares the per-node rate limiter or a broker TLS bundle.
    dispatch-interval: 5s        # AlertDispatcher claim cadence
    max-attempts: 5              # a delivery goes DEAD after this many failures
    connect-timeout: 10s         # notificationRestClient connect + read timeout
    initial-backoff: 5s          # first retry delay (exponential with jitter)
    max-backoff: 10m             # backoff ceiling
  sse:
    # Keep-alive comment interval for GET /api/v1/stream (ADR-0018). Lower it if a
    # proxy in front of Studio idles the connection out sooner than this.
    heartbeat-interval: 20s
  security:
    # Governance (Phase 8, ADR-0037, ADR-0040).
    session-timeout: 8h
    oidc-claim: groups            # the token/userinfo claim mapped by oidc_role_mapping
    # oidc-default-role: VIEWER   # role granted when no mapping matches; unset refuses the login

logging:
  level:
    io.github.sudoitir.artemisstudio: INFO
