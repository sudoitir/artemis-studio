spring:
  application:
    name: artemis-studio

  datasource:
    url: ${ARTEMIS_STUDIO_DB_URL:jdbc:postgresql://localhost:5432/artemis_studio}
    username: ${ARTEMIS_STUDIO_DB_USER:artemis_studio}
    password: ${ARTEMIS_STUDIO_DB_PASSWORD:artemis_studio}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    # Liquibase owns the schema; Hibernate only maps to it and checks the mapping
    # on startup. Never let Hibernate touch DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  threads:
    virtual:
      enabled: true

server:
  port: ${ARTEMIS_STUDIO_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    build:
      enabled: true

# Application configuration, bound by ArtemisStudioProperties.
artemis-studio:
  # base64 of 32 bytes; encrypts stored broker credentials (ADR-0009).
  # The app fails to start if this is missing or the wrong length.
  secret-key: ${ARTEMIS_STUDIO_SECRET_KEY:}
  branding:
    # If the project is renamed, this string and Branding.java move together.
    product-name: "Artemis Studio"
  scrape:
    # Tiered polling cadence (see docs/architecture.md). Only tier A is used in
    # Phase 1 (HaRefreshTask); B and C arrive with the Phase 2 scheduler.
    tier-a-interval: 5s      # topology, HA state, broker counters
    tier-b-interval: 15s     # queues with consumers or non-zero depth
    tier-c-interval: 5m      # idle queues
  rate-limit:
    # Per broker node. Conservative default so Studio never becomes the load.
    # Enforced by the Phase 2 scheduler's token bucket.
    management-calls-per-second: 20
  broker:
    # RestClient timeouts for every Jolokia call (ADR-0010).
    connect-timeout: 3s
    read-timeout: 10s

logging:
  level:
    io.github.sudoitir.artemisstudio: INFO
