# The bootstrap phase (ADR-0047). This file is read before application.yml, into a
# separate context that exists only to build the Environment the main context then
# starts from. It carries exactly two things and should never grow a third kind:
#
#   1. what JdbcConfigPropertySourceLocator needs to reach Postgres, because it runs
#      before the DataSource exists and cannot ask Spring for one;
#   2. the key that decrypts {cipher} values, because a value has to be readable
#      before anything can be bound to it.
#
# Everything else belongs in application.yml (packaged defaults), in
# rahdar_config_property (deploy-time, per environment), or in rahdar_setting
# (operator-tunable, changed from the Settings screen without a restart).
#
# Precedence, lowest to highest: bootstrap.yml -> application.yml ->
# rahdar_config_property -> environment variables. A rahdar_setting override is not
# in this chain at all: it is read through SettingsService, not the Environment.

spring:
  application:
    name: rahdar


  # Same variables as application.yml, repeated rather than imported: the bootstrap
  # context has no access to application.yml, and duplicating three placeholders is
  # cheaper than the indirection that would avoid it.
  datasource:
    url: ${RAHDAR_DB_URL:jdbc:postgresql://localhost:5432/rahdar}
    username: ${RAHDAR_DB_USER:rahdar}
    password: ${RAHDAR_DB_PASSWORD:rahdar}

# Symmetric key for {cipher} values stored in rahdar_config_property. Unset means
# encryption is simply unavailable and a {cipher} value stays an opaque string —
# it does not mean it is silently used in the clear.
#
# This is NOT the stored-secret key. RAHDAR_SECRET_KEY (ADR-0132) protects
# broker credentials and the other stored secrets and is the only thing that
# touches them. Two keys, two jobs; do not set them to the same value.
encrypt:
  key: ${RAHDAR_CONFIG_ENCRYPT_KEY:}
