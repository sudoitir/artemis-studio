name: OSV-Scanner

# Known vulnerabilities in every dependency manifest (ADR-0124). A pull request fails when it
# introduces one; main and the weekly run fail on any, so a CVE published against an existing
# dependency surfaces within a week.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 3 * * 1"

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.6.0
    with:
      runs-on: ubuntu-26.04
      scan-args: |-
        -L pom.xml
        -L web/package-lock.json
        -L site/package-lock.json
        -L examples/plugin-template/pom.xml

  scan:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      runs-on: ubuntu-26.04
      scan-args: |-
        -L pom.xml
        -L web/package-lock.json
        -L site/package-lock.json
        -L examples/plugin-template/pom.xml
