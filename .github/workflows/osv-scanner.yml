name: OSV-Scanner

# Known vulnerabilities in every dependency manifest (ADR-0124). Main and the weekly run fail on
# any, so a CVE published against an existing dependency surfaces within a week. Pull requests are
# scanned by ci.yml's `osv` job, behind the required `ci-ok` check, only when a manifest changed.
on:
  push:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'web/package-lock.json'
      - 'site/package-lock.json'
      - 'examples/plugin-template/pom.xml'
      - '.github/workflows/osv-scanner.yml'
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      runs-on: ubuntu-26.04
      scan-args: |-
        -L pom.xml
        -L web/package-lock.json
        -L site/package-lock.json
        -L examples/plugin-template/pom.xml
