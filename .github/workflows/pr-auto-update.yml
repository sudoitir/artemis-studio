name: Update auto-merge PRs

# The ruleset requires a branch that is up to date with main (ADR-0126). This acts as a serial
# queue for the PRs that have auto-merge enabled (ADR-0170): it walks them oldest auto-merge
# first and keeps exactly one PR up to date, the one in flight. CI re-runs on it and auto-merge
# merges it when green, so the merged tree is the tested tree. Updating every PR at once would
# only spend CI on branches that go stale again when the first one merges.
# The update is pushed with a personal access token, because a push made with GITHUB_TOKEN does
# not trigger CI. The workflow never checks out or runs PR code, and `workflow_run` (not
# `pull_request_target`) keeps the token away from PR-controlled events.
on:
  # The in-flight PR merged: advance to the next.
  push:
    branches: [main]
  # A CI run finished: if the in-flight PR failed, advance past it. Every run is a full walk,
  # so a run for another event only finds nothing to do.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The backstop for a missed event.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Never cancel a run: two walks that update at once would race. A waiting run is replaced by a
# newer one, which sees everything the older one would have.
concurrency:
  group: pr-auto-update
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Keep the next PR to merge up to date
        env:
          GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::The PR_UPDATE_TOKEN secret is not set, so no pull request is updated (ADR-0170)."
            exit 0
          fi
          export GH_REPO="$GITHUB_REPOSITORY"
          # Oldest auto-merge first, the PR number breaking a tie. Without auto-merge a PR sorts last.
          prs=$(gh pr list --base main --state open --limit 100 \
            --json number,headRefOid,isDraft,isCrossRepository,autoMergeRequest \
            --jq 'sort_by([(.autoMergeRequest.enabledAt // "9"), .number])
              | .[] | [.number, .headRefOid, .isDraft, .isCrossRepository, (.autoMergeRequest.enabledAt // "")] | @tsv')
          if [ -z "$prs" ]; then echo "No open pull requests."; exit 0; fi
          while IFS=$'\t' read -r number sha draft fork enabled; do
            if [ "$draft" = true ]; then echo "#$number skipped: draft"; continue; fi
            if [ "$fork" = true ]; then echo "#$number skipped: from a fork"; continue; fi
            if [ -z "$enabled" ]; then echo "#$number skipped: auto-merge is not enabled"; continue; fi
            # The state of the required check on the head the PR has now.
            ci=$(gh pr view "$number" --json statusCheckRollup --jq '
              [.statusCheckRollup[] | select(.name == "ci-ok")] | sort_by(.startedAt) | last
              | if . == null then "none" elif .status != "COMPLETED" then "running"
                else (.conclusion | ascii_downcase) end')
            # mergeStateStatus is computed lazily and reads BLOCKED while checks are pending, so
            # ask git whether main has commits the PR lacks.
            behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .ahead_by)
            # A result on a head that is behind main is about old code (and a cancelled run makes
            # ci-ok fail too), so a PR that is behind is updated whatever it says: that runs CI
            # afresh. Only a result on an up-to-date head is believed.
            if [ "$behind" -eq 0 ]; then
              case "$ci" in
                failure|timed_out|startup_failure)
                  echo "#$number skipped: ci-ok is $ci on an up-to-date head; its author has to fix it"
                  continue ;;
                cancelled|stale)
                  echo "::warning::#$number skipped: ci-ok is $ci on an up-to-date head; re-run its CI"
                  continue ;;
              esac
            fi
            if [ "$behind" -eq 0 ]; then
              echo "#$number is in flight: up to date with main, ci-ok is $ci; the PRs after it wait"
              break
            fi
            # expected_head_sha makes a push to the PR since the listing a 422, not a lost commit.
            if out=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" \
                -f expected_head_sha="$sha" --jq .message 2>&1); then
              echo "#$number updated: merged main ($behind commits) into the branch; it is in flight, the PRs after it wait"
              break
            fi
            if printf '%s' "$out" | grep -qi conflict; then
              echo "::warning::#$number skipped: it conflicts with main, its author has to resolve it"
              continue
            fi
            echo "::warning::#$number not updated, so the walk stops: $out"
            break
          done <<< "$prs"
