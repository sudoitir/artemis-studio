# Documentation site → GitHub Pages (ADR-0061 D5).
#
# Deliberately separate from ci.yml: the release job there commits, tags and
# pushes atomically before the image reaches Docker Hub, and a documentation
# build that can fail must not be able to interleave with that.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'changelog/**'
      - '.github/workflows/pages.yml'
  # A PR that touches the site only builds it, so a broken build is caught before
  # merge; deploy stays on main.
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'changelog/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelled mid-flight: a cancelled deploy
# leaves the live site on whichever half finished.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # `lastUpdated` reads each page's git commit time; a shallow clone
          # gives every page the same date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/src/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
