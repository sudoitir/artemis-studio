name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a PR's run, but never main's: main's run is a release, which tags
# before it pushes the image, so cancelling it burns a version with nothing published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Persistent build cache, stored as a separate tag in the public Docker Hub repo.
# Anonymous pull works, so PR builds (no login) can still warm from it; only the
# release job writes it. Survives across runs without GHA's 10 GB eviction.
env:
  BUILDCACHE: sudoit1/artemis-studio:buildcache
  # Pinned: the changelog is a published artifact, not a best-effort render.
  GIT_CLIFF: git-cliff@2.13.1

jobs:
  # Which parts of the tree this push or PR touches (ADR-0088). A push compares
  # against the commit before it, a PR against its base. Every later job keys off
  # these outputs, so a docs- or site-only change runs nothing here and releases
  # nothing; pages.yml owns the site.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
            backend:
              - *ci
              - 'src/**'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
            web:
              - *ci
              - 'web/**'
            # The plugin template and the SDK package: built and run against Studio (ADR-0102).
            plugin:
              - *ci
              - 'examples/plugin-template/**'
              - 'web/packages/**'
            image:
              - *ci
              - 'src/**'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'web/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'docs/dockerhub.md'

  # Backend and frontend are coupled through the OpenAPI snapshot (web/openapi.json,
  # written by a backend test) and the schema generated from it, so a change on
  # either side runs both.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (Spotless check, Liquibase vs Testcontainers Postgres, tests)
        run: ./mvnw -B verify
      - name: Fail on unformatted sources or a stale OpenAPI snapshot
        run: git diff --exit-code

  frontend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Fail on a stale generated API schema
        run: git diff --exit-code src/kernel/api/schema.d.ts
      - run: npm run lint
      - run: npm test

  # The plugin kit, end to end (ADR-0102): build the template plugin against this Studio's API
  # jar and SDK, check it exactly as an upload would, then install, use, update, roll back and
  # remove it through a running Studio's API and UI.
  plugin-template:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
      || needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: artemis_studio
          POSTGRES_USER: artemis_studio
          POSTGRES_PASSWORD: artemis_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artemis_studio" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Studio (runnable jar with its UI; API jar into the local repository)
        run: ./mvnw -B -Pfrontend -DskipTests install

      - name: Pack the plugin SDK from this build
        working-directory: web
        run: |
          node packages/plugin-sdk/build.mjs 2026.01.0
          (cd packages/plugin-sdk/dist && npm pack)

      - name: Build the template as 1.0.0 and 1.0.1, each checked as Studio will check it
        run: |
          set -euo pipefail
          SDK=$(ls "$GITHUB_WORKSPACE"/web/packages/plugin-sdk/dist/*.tgz)
          for V in 1.0.0 1.0.1; do
            rm -rf "$RUNNER_TEMP/tpl" && cp -r examples/plugin-template "$RUNNER_TEMP/tpl"
            sed -i "0,/<version>1.0.0<\/version>/s//<version>$V<\/version>/" "$RUNNER_TEMP/tpl/pom.xml"
            ./mvnw -B -f "$RUNNER_TEMP/tpl/pom.xml" verify \
              -Dstudio.version=0.1.0-SNAPSHOT -Dstudio.since=2026.01.0 -Dstudio.sdk="$SDK"
            cp "$RUNNER_TEMP/tpl/target/acme-notes-$V.jar" "$RUNNER_TEMP/"
          done

      - name: Start Studio
        run: |
          set -euo pipefail
          ARTEMIS_STUDIO_DB_URL=jdbc:postgresql://localhost:5432/artemis_studio \
          ARTEMIS_STUDIO_DB_USER=artemis_studio ARTEMIS_STUDIO_DB_PASSWORD=artemis_studio \
          ARTEMIS_STUDIO_SECRET_KEY="$(openssl rand -base64 32)" \
            nohup java -jar target/artemis-studio-exec.jar > "$RUNNER_TEMP/studio.log" 2>&1 &
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health >/dev/null; do sleep 2; done'
          timeout 60 bash -c "until grep -q 'password:' '$RUNNER_TEMP/studio.log'; do sleep 1; done"
          echo "ADMIN_PASSWORD=$(awk '/password:/ {print $2; exit}' "$RUNNER_TEMP/studio.log")" >> "$GITHUB_ENV"

      - name: Install, use, update, roll back and remove the plugin
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          STUDIO=http://localhost:8080 NEW_PASSWORD="ci-$(openssl rand -hex 12)" \
          JAR_V1="$RUNNER_TEMP/acme-notes-1.0.0.jar" JAR_V2="$RUNNER_TEMP/acme-notes-1.0.1.jar" \
            node --experimental-strip-types scripts/plugin-e2e.ts

      - name: Studio's log
        if: failure()
        run: tail -300 "$RUNNER_TEMP/studio.log"

  # Pull requests: prove the Dockerfile still builds. Single-arch, no push.
  # A skipped check counts as passed, so `!failure() && !cancelled()` lets this run
  # when only one side changed and the other job was skipped.
  image:
    if: >-
      !failure() && !cancelled() && github.event_name == 'pull_request'
      && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-26.04
    needs: [changes, backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: artemis-studio:ci
          # Warm from the release job's registry cache (anonymous pull); keep a
          # per-branch GHA layer so successive PR pushes stay incremental.
          cache-from: |
            type=registry,ref=${{ env.BUILDCACHE }}
            type=gha
          cache-to: type=gha,mode=max

  # Pushes to main that change what the image is built from: cut a CalVer release.
  # A docs-only push releases nothing; its commits land in the next release's
  # changelog. See .claude/rules/10-release.md and ADR-0088.
  release:
    if: >-
      !failure() && !cancelled() && github.event_name == 'push'
      && github.ref == 'refs/heads/main' && needs.changes.outputs.image == 'true'
    runs-on: ubuntu-26.04
    needs: [changes, backend, frontend]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version = date + one past the highest PATCH already tagged this month.
      # Only tags matching the canonical CalVer shape are candidates, so a stray
      # or hand-made tag can neither be parsed as a PATCH nor shift the counter.
      - name: Compute CalVer version
        id: ver
        run: |
          set -euo pipefail
          BASE=$(date -u +%Y.%m)
          LAST=$(git tag -l "$BASE.*" | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LAST" ]; then PATCH=0; else PATCH=$(( ${LAST##*.} + 1 )); fi
          VERSION="$BASE.$PATCH"
          echo "$VERSION" | grep -qE '^[0-9]{4}\.[0-9]{2}\.[0-9]+$' \
            || { echo "::error::computed version '$VERSION' is not CalVer"; exit 1; }
          # A version tag is published to Docker Hub immutably, so it must never be
          # reused. The local tag list can be stale; the remote is the authority.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::tag $VERSION already exists on origin — refusing to republish"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "month=$BASE"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "→ releasing $VERSION"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set project version and build the jar
        run: |
          ./mvnw -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false
          ./mvnw -B -Pfrontend -DskipTests package

      - name: Stage release assets
        run: |
          V=${{ steps.ver.outputs.version }}
          cp target/artemis-studio-exec.jar "artemis-studio-$V.jar"
          sha256sum "artemis-studio-$V.jar" > "artemis-studio-$V.jar.sha256"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The changelog is generated from the commit messages in this release, one
      # file per version. See ADR-0051 and .claude/rules/05-commits.md.
      - name: Write the release's changelog entry
        id: notes
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          npx -y "$GIT_CLIFF" --config cliff.toml --unreleased --tag "$V" -o "changelog/$V.md"
          python3 scripts/release-notes.py "$V"
          python3 scripts/changelog-index.py
          echo "→ release body:"; cat release-notes.md

      # Reserve the version in git BEFORE anything immutable is published. If the
      # image push were first and this step then failed, the next run would compute
      # the same version and overwrite an already-published Docker Hub tag. Burning
      # a version number on a later failure is the cheaper outcome. The push is
      # atomic so main can never carry a release commit without its tag.
      - name: Commit and tag
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.version }}
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog
          git commit -m "Release $V [skip ci]"
          git tag -a "$V" -m "Release $V"
          git push --atomic origin HEAD:main "refs/tags/$V"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # No SBOM/provenance attestations: they add `unknown/unknown` manifest
          # entries that clutter the Docker Hub tag view and hide the real arches.
          # ADR-0042 defers supply-chain attestation until there are verifiers.
          provenance: false
          sbom: false
          # Registry cache: not size-capped like GHA, shared across every run and
          # readable by PR builds. mode=max caches the web/maven build stages too.
          cache-from: |
            type=registry,ref=${{ env.BUILDCACHE }}
            type=gha
          cache-to: type=registry,ref=${{ env.BUILDCACHE }},mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/artemis-studio:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/artemis-studio:${{ steps.ver.outputs.month }}
            ${{ secrets.DOCKERHUB_USERNAME }}/artemis-studio:dev
          labels: |
            org.opencontainers.image.title=Artemis Studio
            org.opencontainers.image.description=Cluster-wide management and observability for Apache ActiveMQ Artemis
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.ver.outputs.date }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          prerelease: true
          files: |
            artemis-studio-${{ steps.ver.outputs.version }}.jar
            artemis-studio-${{ steps.ver.outputs.version }}.jar.sha256

      # Last in the job on purpose: the image and the GitHub release are already
      # published by now, so a failure here cannot burn a version number — which
      # is why it does not need `continue-on-error`, and why it had it. This
      # step failed with `Forbidden` on every release while that flag reported
      # the job green. The description API rejects a repo-scoped PAT: the
      # credential needs read, write AND delete scope.
      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/artemis-studio
          # Its own file, not README.md: the repository landing page carries a
          # roadmap, contributing notes and a trademark section that mean nothing
          # to someone reading a tag list.
          readme-filepath: docs/dockerhub.md
          short-description: Cluster-wide management and observability for Apache ActiveMQ Artemis
          # Docker Hub does not resolve repo-relative paths, so without this the
          # screenshots render broken even when the push succeeds.
          enable-url-completion: true

  # The plugin API on Maven Central (ADR-0102): the plain jar of the release just tagged, with its
  # sources and javadoc, signed. Its own job, after the release: a Central problem never holds back
  # the image. japicmp refuses an incompatible change to @PluginApi types first.
  publish-api:
    needs: release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
      - name: Check the publishing secrets are set
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=0
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [ -z "${!name}" ]; then echo "::error::repository secret $name is not set"; missing=1; fi
          done
          exit $missing
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
      - name: Publish io.github.sudoitir:artemis-studio:${{ needs.release.outputs.version }}
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B versions:set -DnewVersion="${{ needs.release.outputs.version }}" -DgenerateBackupPoms=false
          ./mvnw -B -Prelease,api-check -DskipTests -Dspring-boot.repackage.skip=true -Dgpg.signer=bc deploy

  # The plugin SDK on npm (ADR-0102), versioned like Studio (2026.09.0 is npm 2026.9.0). Trusted
  # publishing through GitHub's OIDC once it is set up on npmjs.com; until then — the first
  # publish, which trusted publishing needs to exist — the NPM_STAGE_TOKEN secret.
  publish-sdk:
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Build @artemis-studio/plugin-sdk
        working-directory: web
        run: |
          npm ci
          node packages/plugin-sdk/build.mjs "${{ needs.release.outputs.version }}"
      - name: Publish
        working-directory: web/packages/plugin-sdk/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        # Trusted publishing (OIDC) needs npm 11.5.1 or later; fail here rather than fall back to the token silently.
        run: |
          npx -y semver@7 -r '>=11.5.1' "$(npm -v)" >/dev/null || { echo "npm $(npm -v) is too old to publish"; exit 1; }
          npm publish --access public --provenance
