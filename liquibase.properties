# Connection for the liquibase-maven-plugin (human-run CLI ops only; runtime
# migration is done by Spring Boot on startup). Values come from the environment
# so nothing secret is committed. Point these at a throwaway DB for `diff`.
#
#   mvn liquibase:status
#   mvn liquibase:updateSQL
#   mvn liquibase:rollback -Dliquibase.rollbackCount=1
#   mvn liquibase:diff

changeLogFile: src/main/resources/db/changelog/db.changelog-master.xml
url: ${env.ARTEMIS_STUDIO_DB_URL:-jdbc:postgresql://localhost:5432/artemis_studio}
username: ${env.ARTEMIS_STUDIO_DB_USER:-artemis_studio}
password: ${env.ARTEMIS_STUDIO_DB_PASSWORD:-artemis_studio}
driver: org.postgresql.Driver
