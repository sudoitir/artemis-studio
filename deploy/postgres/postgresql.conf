# Artemis Studio — PostgreSQL 18 server configuration for the BUNDLED database.
#
# One complete file, mounted read-only by every compose stack (production, HA and development)
# and loaded with `postgres -c config_file=/etc/postgresql/postgresql.conf`, so no stack carries
# its own list of `-c` flags. ADR-0195.
#
# Studio does not depend on any of it. Every limit Studio needs is set on its own connections,
# so Studio runs the same on a managed or self-run PostgreSQL 18 with different settings. For
# such a server, treat this file as the recommended baseline.
#
# Values assume a small dedicated box: ~4 GB RAM, SSD. Re-tune for real hardware; the ones that
# matter most are shared_buffers, effective_cache_size and max_wal_size.

# ── Connections ──────────────────────────────────────────────────────────────
listen_addresses = '*'                 # the container's network is the boundary; publish the port deliberately
# Each Studio replica holds a pool of 16, one listening connection and up to three per active
# plugin. 150 holds a few replicas with room for an operator's psql and the plugins.
max_connections = 150

# ── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 512MB                 # ~25% of RAM
effective_cache_size = 2GB             # ~50-75% of RAM; planner hint, not an allocation
work_mem = 16MB                        # per sort/hash node; raise for heavy metric queries
maintenance_work_mem = 256MB           # index builds, VACUUM
huge_pages = try

# ── WAL / checkpoints ────────────────────────────────────────────────────────
wal_compression = zstd
max_wal_size = 3GB                     # fewer checkpoints under scrape write load
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# ── Planner and I/O (SSD) ────────────────────────────────────────────────────
random_page_cost = 1.1
# PostgreSQL 18 reads asynchronously. `worker` is the default, set here on purpose: `io_uring`
# is blocked by Docker's default seccomp profile, and a server that fell back silently would
# be harder to explain than one that names its method.
io_method = worker
# How many reads a session keeps in flight under AIO; an unnecessarily high value raises
# latency for every query. 64 suits a local SSD.
effective_io_concurrency = 64
default_statistics_target = 200        # better plans on skewed queue/metric data

# ── Autovacuum ───────────────────────────────────────────────────────────────
# A global floor. The high-churn tables set tighter storage parameters of their own in the
# Liquibase changesets, by class: append-only history vacuums on inserts, hot-update state
# keeps free space for HOT updates, UNLOGGED expiry tables vacuum almost always.
autovacuum = on
autovacuum_naptime = 15s               # the default is 1 min; scrape writes outrun that
autovacuum_max_workers = 4
autovacuum_vacuum_cost_limit = 2000    # the default 200 throttles a vacuum below the write rate
autovacuum_vacuum_insert_scale_factor = 0.1
log_autovacuum_min_duration = 250ms

# ── Statistics and logging ───────────────────────────────────────────────────
# pg_stat_statements is preloaded here and created in the database by
# deploy/postgres/10-pg-stat-statements.sql, so statement statistics exist with no setup.
# compute_query_id = on makes the query id available to it and to the logs.
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
pg_stat_statements.track = top
track_io_timing = on
track_functions = pl
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on                    # logs a wait longer than deadlock_timeout (1 s)

# ── Sessions ─────────────────────────────────────────────────────────────────
timezone = 'UTC'
log_timezone = 'UTC'
# Backstop only. Studio ends its own idle transactions after 60 s on each connection; this
# catches any other client of the bundled database (a forgotten psql session) after 5 min.
idle_in_transaction_session_timeout = 5min
