# Artemis Studio — PostgreSQL server tuning.
#
# Mounted into the container and loaded via `-c config_file` is overkill; instead
# compose passes `-c include=...` or appends these with `ALTER SYSTEM`-style
# `-c key=value` flags. See deploy/compose/*.yaml.
#
# Values below assume a small dedicated box: ~4 GB RAM, SSD. Re-tune for real
# hardware — the three that matter most are shared_buffers, effective_cache_size,
# and max_wal_size.

# ── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 512MB                 # ~25% of RAM
effective_cache_size = 2GB             # ~50-75% of RAM; planner hint, not an allocation
work_mem = 16MB                        # per sort/hash node; raise for heavy metric queries
maintenance_work_mem = 256MB          # index builds, VACUUM
huge_pages = try

# ── WAL / checkpoints ────────────────────────────────────────────────────────
wal_compression = zstd
max_wal_size = 3GB                     # fewer checkpoints under scrape write load
min_wal_size = 512MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# ── Planner (SSD) ────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200        # better plans on skewed queue/metric data

# ── Autovacuum ───────────────────────────────────────────────────────────────
# Global floor; the high-churn tables (queue_snapshot, metric_sample, audit_event,
# alert_state, rr_flow) set their own tighter per-table parameters in the
# Liquibase changesets.
autovacuum = on
autovacuum_naptime = 15s
autovacuum_max_workers = 4
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_insert_scale_factor = 0.1

# ── Observability ────────────────────────────────────────────────────────────
track_io_timing = on
track_functions = pl
log_min_duration_statement = 500ms
log_autovacuum_min_duration = 250ms
log_checkpoints = on
log_lock_waits = on

# ── Misc ─────────────────────────────────────────────────────────────────────
timezone = 'UTC'
idle_in_transaction_session_timeout = 60s
