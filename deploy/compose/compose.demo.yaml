# Artemis Studio — DEMO overlay on top of the dev stack.
#
#   docker compose -f deploy/compose/compose.dev.yaml \
#                  -f deploy/compose/compose.demo.yaml up -d      (or: just demo)
#
# Adds a second and a third live/backup replication pair, so every cross-node view
# has six nodes rather than two — which is the difference between a screenshot that
# shows the product and one that shows a laptop. Three pairs, not two: quorum voting
# needs at least three primaries to keep a majority when one pair is lost.
# `just demo` then drives real traffic through it with the broker image's own
# client; nothing writes to `metric_sample` directly, because a chart of invented samples is worth less than no chart.
#
# Not hardened, not for anywhere public.

name: artemis-studio-dev

services:
  artemis-secondary:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Studio and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8361:8161"
      - "61618:61616"
    volumes:
      - ./artemis/secondary/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u artemis:artemis 'http://localhost:8161/console/jolokia/read/org.apache.activemq.artemis:broker=%22secondary%22/Started' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-secondary-backup:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Studio and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8461:8161"
      - "61619:61616"
    volumes:
      - ./artemis/secondary-backup/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    depends_on:
      artemis-secondary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u artemis:artemis 'http://localhost:8161/console/jolokia/read/org.apache.activemq.artemis:broker=%22secondary-backup%22/Started' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-tertiary:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Studio and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8561:8161"
      - "61620:61616"
    volumes:
      - ./artemis/tertiary/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u artemis:artemis 'http://localhost:8161/console/jolokia/read/org.apache.activemq.artemis:broker=%22tertiary%22/Started' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  artemis-tertiary-backup:
    image: apache/artemis:2.57.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      # The image's default heap is 2 GB per broker; several of them, Studio and Postgres must fit
      # in a laptop's Docker VM (Docker Desktop's is often 4 to 8 GB), or its OOM killer ends one.
      JAVA_ARGS_APPEND: "-Xms64m -Xmx512m"
    ports:
      - "8661:8161"
      - "61621:61616"
    volumes:
      - ./artemis/tertiary-backup/broker.xml:/var/lib/artemis-instance/etc-override/broker.xml:ro
    depends_on:
      artemis-tertiary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u artemis:artemis 'http://localhost:8161/console/jolokia/read/org.apache.activemq.artemis:broker=%22tertiary-backup%22/Started' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
