# HAProxy in front of the Studio replicas (compose.ha.yaml).
#
# - Routes on readiness (/readyz): a replica that is starting or draining leaves the pool
#   within about two seconds, before it stops serving.
# - No stickiness: sessions and the event stream work on any replica.
# - Timeouts sit above the stream's 20 s keep-alive, so an idle stream is never cut.

global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h
  # Retry a request on the other replica when a connection to one is refused.
  retries 2
  option redispatch

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend studio
  bind :8080
  default_backend replicas

backend replicas
  balance leastconn
  option httpchk GET /readyz
  http-check expect status 200
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr none
  server studio-1 studio-1:8080 check
  server studio-2 studio-2:8080 check
