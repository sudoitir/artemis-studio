# Artemis Studio — PROD reference stack.
#
#   docker compose -f deploy/compose/compose.prod.yaml --env-file .env up -d
#
# Runs Artemis Studio and its Postgres only. Your Artemis clusters already exist
# and are registered through the UI — this file does not start any brokers.
#
# Everything sensitive comes from .env (see deploy/compose/.env.example). This is
# a reference, not a turnkey deployment: put Postgres on managed infrastructure
# and terminate TLS at your ingress for anything serious. Helm chart lands in v1.0.
#
# The default image is a pre-stable dev build (tag :dev). There is no stable
# release yet — pin a CalVer tag (e.g. :2026.09.0) once you depend on it.

name: artemis-studio

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    # The whole server configuration is deploy/postgres/postgresql.conf (ADR-0195), shared with
    # the HA and development stacks. Put Postgres on managed infrastructure for anything serious.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ../postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../postgres/10-pg-stat-statements.sql:/docker-entrypoint-initdb.d/10-pg-stat-statements.sql:ro
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2g

  studio:
    image: ${STUDIO_IMAGE:-sudoit1/artemis-studio:dev}
    # The live UI stream is Server-Sent Events at GET /api/v1/stream. If you put a
    # reverse proxy in front of Studio, it MUST NOT buffer that response:
    #   nginx    -> proxy_buffering off;  (Studio also sends X-Accel-Buffering: no)
    #   Apache   -> no output buffering on the /api/v1/stream location
    #   Traefik  -> works out of the box
    # Without this the topology graph and queue grid only update on the 5s poll.
    environment:
      ARTEMIS_STUDIO_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      ARTEMIS_STUDIO_DB_USER: ${DB_USER}
      ARTEMIS_STUDIO_DB_PASSWORD: ${DB_PASSWORD}
      # Key for every stored secret (ADR-0132): base64 of 32 bytes, or `1=<b64>,2=<b64>` for rotation.
      ARTEMIS_STUDIO_SECRET_KEY: ${SECRET_KEY:?}
      # The broker role Studio's own broker user holds. Required for message capture only:
      # capture queues are restricted to it, and capture is refused until it is set.
      ARTEMIS_STUDIO_CAPTURE_BROKER_ROLE: ${CAPTURE_BROKER_ROLE:-}
      # A plugin that needs a restart restarts Studio itself; `restart: unless-stopped` below
      # is what starts it again. Remove both together, never one (ADR-0104).
      ARTEMIS_STUDIO_PLUGINS_RESTART_SUPERVISED: "true"
      # Pin plugin publishers' keys here instead of in the UI (ADR-0166; site/src/guide/plugins.md).
      # Each key needs a name and a PEM certificate or public key; the number is the item's index.
      # ARTEMIS_STUDIO_PLUGINS_TRUSTED_KEYS_0_NAME: Example Publisher
      # ARTEMIS_STUDIO_PLUGINS_TRUSTED_KEYS_0_PEM: ${PUBLISHER_KEY_PEM:?}
      # Metaspace is bounded so a plugin that does not unload cleanly fails loudly rather than
      # growing without limit; a restart frees it.
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:MaxMetaspaceSize=384m}
      # The standard OpenTelemetry variables from .env (.env.example): empty ones stay unset, so nothing is
      # exported until OTEL_EXPORTER_OTLP_ENDPOINT and a signal's exporter are set (site/src/guide/observability.md).
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
      OTEL_PROPAGATORS: ${OTEL_PROPAGATORS:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
    ports:
      - "${STUDIO_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
