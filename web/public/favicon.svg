<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Artemis Studio">
  <!-- The crescent bow: Artemis' moon drawn as a bow, and one arrow into the one node that
       needs you, the queue found across the whole cluster. -->
  <defs>
    <linearGradient id="as-moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66e3f0"/>
      <stop offset="1" stop-color="#0b7285"/>
    </linearGradient>
    <mask id="as-bite">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="19" cy="16" r="9.2" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b1418"/>
  <circle cx="13" cy="16" r="10.5" fill="url(#as-moon)" mask="url(#as-bite)"/>
  <path d="M9.5 16H21" stroke="#f2fdff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="24" cy="16" r="5.3" fill="none" stroke="#66e3f0" stroke-width=".9" opacity=".5"/>
  <circle cx="24" cy="16" r="3" fill="#f2fdff"/>
</svg>
