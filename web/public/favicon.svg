<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Artemis Studio">
  <!-- The crescent bow. Artemis' moon is the bow, drawn and loosed: one arrow, flying
       straight to the thing that needs you. The faint ring is the rest of the moon. -->
  <defs>
    <radialGradient id="as-tile" cx=".7" cy=".3" r=".9">
      <stop offset="0" stop-color="#12303a"/>
      <stop offset="1" stop-color="#081115"/>
    </radialGradient>
    <linearGradient id="as-moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ceaf5"/>
      <stop offset=".55" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#0b7285"/>
    </linearGradient>
    <mask id="as-bite">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/>
      <circle cx="8.3" cy="16" r="10" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#as-tile)"/>
  <g transform="translate(1.29 -1.97) rotate(-38 16 16)">
    <circle cx="12.8" cy="16" r="10.3" fill="none" stroke="#3bc9db" stroke-width=".6" opacity=".16"/>
    <path d="M9.87 6.12 4.4 16l5.47 9.88" fill="none" stroke="#9eeaf3" stroke-width=".7" stroke-linejoin="round" opacity=".85"/>
    <circle cx="12.8" cy="16" r="10.3" fill="url(#as-moon)" mask="url(#as-bite)"/>
    <circle cx="12.8" cy="16" r="9.95" fill="none" stroke="#d8fbff" stroke-width=".5" opacity=".55" mask="url(#as-bite)"/>
    <path d="M4.7 16h20.5" stroke="#0a171c" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M4.7 16h20.5" stroke="#f4feff" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M29 16l-4.2-2.3q1 2.3 0 4.6z" fill="#f4feff" stroke="#0a171c" stroke-width=".6" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
